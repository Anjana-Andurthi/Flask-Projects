{% extends 'base.html' %}
{% block title %}ATM - Login{% endblock %}

{% block content %}
<div class="main">
    <div class="form-card login-card">
        <div class="atm-logo login-logo-icon">🏧</div>
        <h1 class="page-title">ATM Login</h1>
        <p class="page-subtitle">Enter your account credentials to continue</p>

        {% if info %}
        <div class="alert alert-danger" id="alert-msg">❌ {{ info }}</div>
        {% endif %}

        <form method="post" id="login-form">
            <div class="form-group">
                <label for="accnum">Account Number</label>
                <div class="input-with-icon">
                    <span class="input-currency-symbol">💳</span>
                    <input type="text" id="accnum" name="accnum" class="form-control" placeholder="Enter account number" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="pin">Security PIN</label>
                <div class="input-with-icon">
                    <span class="input-currency-symbol">🔒</span>
                    <input type="password" id="pin" name="pin" class="form-control" placeholder="Enter 4-5 digit PIN" required>
                </div>
            </div>
            <input type="submit" value="Secure Login &rarr;" class="btn btn-primary btn-full" id="btn-login">
        </form>

        <div class="card-footer-links">
            <a href="/confirmemail" class="forgot-pin-link" id="link-forgot-pin">Forgot PIN? Reset via OTP &rarr;</a>
        </div>

    </div>
</div>
{% endblock %}
