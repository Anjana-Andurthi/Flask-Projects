{% extends 'base.html' %}

{% block title %}Sign In - NotesApp{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to access your synchronized notes</p>
        </div>

        {% if info %}
        <div class="alert-container">
            <div class="alert-box alert-danger">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ info }}</span>
            </div>
        </div>
        {% endif %}

        <form method="POST" action="/login" class="auth-form">
            <div class="form-group">
                <label for="email" class="form-label">
                    <i class="fa-regular fa-envelope"></i> Email Address
                </label>
                <div class="input-with-icon">
                    <i class="fa-regular fa-envelope input-icon-lead"></i>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="you@example.com" 
                        required 
                        autocomplete="email"
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fa-solid fa-lock"></i> Password
                </label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock input-icon-lead"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Enter your password" 
                        required 
                        autocomplete="current-password"
                    >
                    <button 
                        type="button" 
                        class="toggle-pwd-btn" 
                        data-target="password" 
                        title="Show/Hide Password"
                        aria-label="Toggle password visibility"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account yet? 
            <a href="/register" class="auth-link">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
