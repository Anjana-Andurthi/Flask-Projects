{% extends 'base.html' %}

{% block title %}Create Account - NotesApp{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="auth-title">Get Started</h1>
            <p class="auth-subtitle">Create an account to organize your notes effortlessly</p>
        </div>

        {% if info %}
        <div class="alert-container">
            <div class="alert-box alert-danger">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ info }}</span>
            </div>
        </div>
        {% endif %}

        <form method="POST" action="/register" class="auth-form">
            <div class="form-group">
                <label for="username" class="form-label">
                    <i class="fa-regular fa-user"></i> Full Username
                </label>
                <div class="input-with-icon">
                    <i class="fa-regular fa-user input-icon-lead"></i>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="e.g. Alex Morgan" 
                        required 
                        autocomplete="username"
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">
                    <i class="fa-regular fa-envelope"></i> Email Address
                </label>
                <div class="input-with-icon">
                    <i class="fa-regular fa-envelope input-icon-lead"></i>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="you@example.com" 
                        required 
                        autocomplete="email"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fa-solid fa-lock"></i> Password
                </label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock input-icon-lead"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Choose a strong password" 
                        required 
                        autocomplete="new-password"
                    >
                    <button 
                        type="button" 
                        class="toggle-pwd-btn" 
                        data-target="password" 
                        title="Show/Hide Password"
                        aria-label="Toggle password visibility"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                <span>Create Account</span>
                <i class="fa-solid fa-sparkles"></i>
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? 
            <a href="/login" class="auth-link">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
